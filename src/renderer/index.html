<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How long have I worked? - Settings</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="settings-container">
        <h1>How long have I worked? Settings</h1>
        
        <!-- Tab Navigation -->
        <div class="tab-navigation">
            <button class="tab-button active" data-tab="work">Work Settings</button>
            <button class="tab-button" data-tab="display">Display</button>
            <button class="tab-button" data-tab="system">System</button>
        </div>

        <!-- Tab Contents -->
        <div class="tab-content">
            <!-- Work Settings Tab -->
            <div class="tab-panel active" id="work-tab">
                <div class="setting-group">
                    <h2>Work Duration</h2>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="workMode" value="totalHours" id="totalHours">
                            <span>Total work hours:</span>
                            <input type="number" id="totalHoursInput" min="1" max="12" value="9" class="number-input">
                            <span>hours</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="workMode" value="endTime" id="endTime">
                            <span>End time:</span>
                            <input type="time" id="endTimeInput" value="18:00" class="time-input">
                        </label>
                    </div>
                </div>
            </div>

            <!-- Display Settings Tab -->
            <div class="tab-panel" id="display-tab">
                <div class="setting-group">
                    <h2>Time Display Mode</h2>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="displayMode" value="remaining" id="displayRemaining">
                            <span>Show remaining time</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="displayMode" value="elapsed" id="displayElapsed">
                            <span>Show elapsed time</span>
                        </label>
                    </div>
                </div>

                <div class="setting-group">
                    <h2>Time Format</h2>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="use24HourFormat">
                            <span>Use 24-hour format (18:00 instead of 6:00 PM)</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- System Settings Tab -->
            <div class="tab-panel" id="system-tab">
                <div class="setting-group">
                    <h2>Auto-start Settings</h2>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="autoStartOnLaunch">
                            <span>Start automatically on app launch</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="autoStartOnBoot">
                            <span>Launch app on system startup</span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <div class="button-group">
            <button id="cancelBtn" class="btn btn-secondary">Cancel</button>
            <button id="saveBtn" class="btn btn-primary">Save</button>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
